name: Build and Release

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        run: dotnet restore PresenceTracker.sln

      - name: Build project
        run: dotnet build -c Release --no-restore PresenceTracker.sln

      - name: Test
        run: dotnet test -c Release --no-build PresenceTracker.sln

      - name: Publish for installer
        run: >
          dotnet publish src/PresenceTracker/PresenceTracker.csproj
          -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -o artifacts/publish/win-x64

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Build installer
        shell: pwsh
        run: |
          $iscc = @(
            "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe",
            "${env:ProgramFiles}\Inno Setup 6\ISCC.exe",
            "${env:LOCALAPPDATA}\Programs\Inno Setup 6\ISCC.exe"
          ) | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $iscc) { throw 'ISCC.exe não encontrado após a instalação do Inno Setup.' }
          New-Item -ItemType Directory -Force artifacts/installer | Out-Null
          & $iscc installer/PresenceTracker.iss
          if ($LASTEXITCODE -ne 0) { throw "Falha ao compilar o instalador (código $LASTEXITCODE)." }

      - name: Publish installer to GitHub Releases
        uses: ncipollo/release-action@v1
        with:
          tag: latest
          name: Latest
          body: Instalador gerado automaticamente a partir de main.
          artifacts: artifacts/installer/PresenceTracker-Setup.exe
          allowUpdates: true
          replacesArtifacts: true
          makeLatest: true
          omitBodyDuringUpdate: true
